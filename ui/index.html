<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --accent:#d32f2f; --gps:#1565c0; --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); font-size:13px; }
  .api { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:13px; }
  .api input { width:230px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 10px; font-size:13px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { display:grid; grid-template-columns: 300px 1fr; height: calc(100vh - 58px); }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:14px; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:6px 0 10px; }
  .trip { display:flex; justify-content:space-between; width:100%; text-align:left; margin-bottom:6px; padding:9px 10px; }
  .trip.active { border-color:var(--accent); background:#fdecec; }
  .trip small { color:var(--muted); }
  #source { font-size:12px; color:var(--muted); margin-bottom:10px; }
  #status { font-size:12px; color:var(--muted); margin:8px 0; min-height:16px; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .card .v { font-size:20px; font-weight:600; font-variant-numeric: tabular-nums; }
  .card .k { font-size:11px; color:var(--muted); }
  .card.big { grid-column: span 2; }
  #map { height:100%; }
  .legend { background:#fff; padding:8px 10px; border-radius:6px; font-size:12px; line-height:1.6; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .sw { display:inline-block; width:14px; height:4px; vertical-align:middle; margin-right:6px; }
  table.t { width:100%; font-size:12px; border-collapse:collapse; margin-top:10px; }
  table.t td { padding:3px 0; border-bottom:1px solid var(--line); }
  table.t td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { main { grid-template-columns:1fr; height:auto; } #map { height:60vh; } .api { margin-left:0; } }
</style>
</head>
<body>
<header>
  <h1>PathSnap</h1><span class="sub">Map-matching &amp; route reconstruction — evaluator console</span>
  <div class="api">API <input id="apiUrl" placeholder="http://LAPTOP1_IP:8000"><button id="connect">Connect</button></div>
</header>
<main>
  <aside>
    <h2>Evaluation trips</h2>
    <div id="source" class="sub"></div>
    <div id="trips"></div>
    <div id="status"></div>
    <div id="result"></div>
  </aside>
  <div id="map"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
let API = params.get("api") || (()=>{ try { return localStorage.getItem("pathsnap_api"); } catch(e){ return null; } })()
          || `http://${location.hostname || "localhost"}:8000`;
$("#apiUrl").value = API;

const map = L.map("map", { preferCanvas: true }).setView([30, 10], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution: "&copy; OpenStreetMap contributors", maxZoom: 19 }).addTo(map);
const gpsLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
L.control.layers(null, { "Raw GPS observations": gpsLayer, "Predicted route (HMM)": routeLayer }, { collapsed:false }).addTo(map);
const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => { const d = L.DomUtil.create("div", "legend");
  d.innerHTML = `<div><span class="sw" style="background:var(--gps);height:8px;width:8px;border-radius:50%"></span>GPS observation</div>
                 <div><span class="sw" style="background:var(--accent)"></span>Predicted route</div>`; return d; };
legend.addTo(map);

function setStatus(t) { $("#status").textContent = t; }
const pct = v => (v === null || v === undefined || Number.isNaN(v)) ? "–" : (100*v).toFixed(2) + "%";

async function loadTrips() {
  API = $("#apiUrl").value.replace(/\/$/, "");
  try { localStorage.setItem("pathsnap_api", API); } catch(e) {}
  setStatus("Connecting to " + API + " …");
  try {
    const r = await fetch(API + "/trips"); if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    $("#source").textContent = "Source: " + data.source;
    $("#trips").innerHTML = "";
    data.trips.forEach(t => {
      const b = document.createElement("button"); b.className = "trip";
      b.innerHTML = `<span>Trip ${t.trip_id}</span><small>${t.n_points} pts</small>`;
      b.onclick = () => runTrip(t.trip_id, b);
      $("#trips").appendChild(b);
    });
    setStatus(`${data.trips.length} trips available. Select one to run.`);
  } catch (e) { setStatus("Could not reach API: " + e.message); }
}

async function runTrip(id, btn) {
  document.querySelectorAll(".trip").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  setStatus(`Sending trip ${id} to API …`); $("#result").innerHTML = "";
  const t0 = performance.now();
  try {
    const r = await fetch(API + "/predict", { method:"POST", headers:{ "Content-Type":"application/json" },
                                             body: JSON.stringify({ trip_id: id }) });
    if (!r.ok) throw new Error(r.status + " " + await r.text());
    const d = await r.json();
    draw(d); showMetrics(d, (performance.now() - t0) / 1000);
    setStatus(`Trip ${id} processed by API.`);
  } catch (e) { setStatus("Error: " + e.message); }
}

function draw(d) {
  gpsLayer.clearLayers(); routeLayer.clearLayers();
  d.gps_points.forEach(p => L.circleMarker(p, { radius:2.5, color:"#1565c0", weight:1, fillOpacity:.8 }).addTo(gpsLayer));
  d.predicted_route.forEach(line => L.polyline(line, { color:"#d32f2f", weight:4, opacity:.85 }).addTo(routeLayer));
  const all = d.gps_points.concat(...d.predicted_route);
  if (all.length) map.fitBounds(L.latLngBounds(all), { padding:[20,20] });
}

function showMetrics(d, rtt) {
  const m = d.metrics;
  $("#result").innerHTML = `
  <div class="metrics">
    <div class="card big"><div class="k">Point-level Top-1 accuracy (classifier + HMM)</div><div class="v">${pct(m.top1_accuracy_hmm)}</div></div>
    <div class="card"><div class="k">Classifier-only Top-1</div><div class="v">${pct(m.top1_accuracy_classifier_only)}</div></div>
    <div class="card"><div class="k">Route F1</div><div class="v">${pct(m.route_f1)}</div></div>
    <div class="card"><div class="k">Route precision</div><div class="v">${pct(m.route_precision)}</div></div>
    <div class="card"><div class="k">Route recall</div><div class="v">${pct(m.route_recall)}</div></div>
    <div class="card big"><div class="k">Route continuity</div><div class="v">${pct(m.route_continuity)}</div></div>
  </div>
  <table class="t">
    <tr><td>Model</td><td>${d.model}</td></tr>
    <tr><td>GPS points / labelled</td><td>${m.n_points} / ${m.n_labelled_points}</td></tr>
    <tr><td>Unmatched points</td><td>${m.n_unmatched_points}</td></tr>
    <tr><td>Predicted route arcs</td><td>${m.n_predicted_route_arcs}</td></tr>
    <tr><td>HMM chain breaks</td><td>${m.hmm_chain_breaks}</td></tr>
    <tr><td>Server pipeline time</td><td>${d.timings_s.total_s.toFixed(2)} s</td></tr>
    <tr><td>Round trip</td><td>${rtt.toFixed(2)} s</td></tr>
  </table>`;
}

$("#connect").onclick = loadTrips;
$("#apiUrl").addEventListener("keydown", e => { if (e.key === "Enter") loadTrips(); });
loadTrips();
</script>
</body>
</html>
